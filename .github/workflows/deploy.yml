# Alternative to `npm run deploy`: builds the Rust/WASM core and the web app on GitHub and
# publishes `dist/` to GitHub Pages. Manual only (run it from the Actions tab).
# Needs Actions enabled for the account, and Settings -> Pages -> Source set to "GitHub Actions"
# (which replaces the main -> /docs source used by `npm run deploy`).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crate

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - run: npm ci
      - name: Rust tests
        run: npm test
      - name: Build (wasm + typecheck + bundle)
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
