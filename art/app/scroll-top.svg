<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 56" width="420" height="56">
  <defs>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf1d6"/><stop offset="0.35" stop-color="#ecdcb4"/>
      <stop offset="0.75" stop-color="#cdb27a"/><stop offset="1" stop-color="#a98d58"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecd2"/><stop offset="1" stop-color="#bda26b"/>
    </linearGradient>
  </defs>
  <g >
    <!-- soft shadow under the roll -->
    <ellipse cx="206" cy="47" rx="188" ry="5" fill="#000" opacity="0.18"/>
    <!-- tube body -->
    <path d="M30 14 Q20 28 30 42 L384 42 L384 14 Z" fill="url(#tube)" stroke="#8f7142" stroke-width="2" stroke-linejoin="round"/>
    <!-- fibre lines -->
    <path d="M44 22H370M40 29H376M44 36H368" stroke="#8f7142" stroke-opacity="0.18" stroke-width="1"/>
    <!-- curled end at the right -->
    <ellipse cx="386" cy="28" rx="15" ry="15" fill="url(#cap)" stroke="#8f7142" stroke-width="2"/>
    <path d="M386 28m0 0c2-2 5 0 4 3s-6 5-9 2-1-10 5-11 12 4 12 11-5 13-13 13" fill="none" stroke="#8f7142" stroke-width="1.6" stroke-linecap="round"/>
    <!-- left edge, paper end peeking out -->
    <path d="M30 14 Q20 28 30 42" fill="none" stroke="#8f7142" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
