<style>body{font:14px system-ui;margin:20px;background:#e9dcb5;color:#2b2417}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

<h1>Mine's Mapper art</h1><p>Open this file in a browser to see every image. Edit the SVGs, refresh, repeat.</p><main><figure><div class="sw"><img src="map/flag.svg"></div><figcaption><b>map/flag.svg</b><br>A flag placed on a hidden square (also the flag-mode button and the 🚩 counter).</figcaption></figure><figure><div class="sw"><img src="map/mine.svg"></div><figcaption><b>map/mine.svg</b><br>A mine on the map (after a loss or when a heart is lost). Also used small as the mine counter (💣). The red square under an exploded mine is drawn by the game.</figcaption></figure><figure><div class="sw"><img src="map/oracle-star.svg"></div><figcaption><b>map/oracle-star.svg</b><br>The oracle power-up under a revealed safe square, and the Oracle button.</figcaption></figure><figure><div class="sw"><img src="map/ice-crystal.svg"></div><figcaption><b>map/ice-crystal.svg</b><br>The ice-clearer power-up under a revealed safe square, and the Ice clearer button.</figcaption></figure><figure><div class="sw"><img src="map/treasure-x.svg"></div><figcaption><b>map/treasure-x.svg</b><br>The X on the treasure levels.</figcaption></figure><figure><div class="sw"><img src="ui/heart-full.svg"></div><figcaption><b>ui/heart-full.svg</b><br>A heart you still have (HUD).</figcaption></figure><figure><div class="sw"><img src="ui/heart-empty.svg"></div><figcaption><b>ui/heart-empty.svg</b><br>A heart you lost (HUD).</figcaption></figure><figure><div class="sw"><img src="ui/star-full.svg"></div><figcaption><b>ui/star-full.svg</b><br>A level star you earned.</figcaption></figure><figure><div class="sw"><img src="ui/star-empty.svg"></div><figcaption><b>ui/star-empty.svg</b><br>A level star you did not earn.</figcaption></figure><figure><div class="sw"><img src="ui/island.svg"></div><figcaption><b>ui/island.svg</b><br>Island mode label (🏝) in the HUD, cards and the &quot;Island cleared&quot; dialog.</figcaption></figure><figure><div class="sw"><img src="ui/endless.svg"></div><figcaption><b>ui/endless.svg</b><br>Endless mode label (♾).</figcaption></figure><figure><div class="sw"><img src="ui/target.svg"></div><figcaption><b>ui/target.svg</b><br>Goal marker in the HUD (🎯).</figcaption></figure><figure><div class="sw"><img src="ui/compass.svg"></div><figcaption><b>ui/compass.svg</b><br>Treasure goal in the HUD and the Free expedition button (🧭).</figcaption></figure><figure><div class="sw"><img src="ui/distance.svg"></div><figcaption><b>ui/distance.svg</b><br>Distance in endless mode (📏).</figcaption></figure><figure><div class="sw"><img src="ui/pickaxe.svg"></div><figcaption><b>ui/pickaxe.svg</b><br>Reveal-mode button (⛏).</figcaption></figure><figure><div class="sw"><img src="ui/progress.svg"></div><figcaption><b>ui/progress.svg</b><br>Progress and Stats buttons (📊).</figcaption></figure><figure><div class="sw"><img src="ui/center.svg"></div><figcaption><b>ui/center.svg</b><br>Back-to-centre button (⌖).</figcaption></figure><figure><div class="sw"><img src="ui/menu.svg"></div><figcaption><b>ui/menu.svg</b><br>Menu button (☰).</figcaption></figure><figure><div class="sw"><img src="ui/globe-3d.svg"></div><figcaption><b>ui/globe-3d.svg</b><br>See the island in 3D (🌍).</figcaption></figure><figure><div class="sw"><img src="ui/restart.svg"></div><figcaption><b>ui/restart.svg</b><br>Restart (↻).</figcaption></figure><figure><div class="sw"><img src="ui/eye.svg"></div><figcaption><b>ui/eye.svg</b><br>Look around / View (👁).</figcaption></figure><figure><div class="sw"><img src="ui/boom.svg"></div><figcaption><b>ui/boom.svg</b><br>Mine hit / game over (💥).</figcaption></figure><figure><div class="sw"><img src="ui/lock.svg"></div><figcaption><b>ui/lock.svg</b><br>Locked adventure level (🔒).</figcaption></figure><figure><div class="sw"><img src="ui/trophy.svg"></div><figcaption><b>ui/trophy.svg</b><br>Finished islands (🏆).</figcaption></figure><figure><div class="sw"><img src="ui/calendar.svg"></div><figcaption><b>ui/calendar.svg</b><br>Daily island (📅).</figcaption></figure><figure><div class="sw"><img src="ui/adventure-map.svg"></div><figcaption><b>ui/adventure-map.svg</b><br>Adventure button (🗺).</figcaption></figure><figure><div class="sw"><img src="ui/settings.svg"></div><figcaption><b>ui/settings.svg</b><br>Settings (⚙).</figcaption></figure><figure><div class="sw"><img src="ui/install.svg"></div><figcaption><b>ui/install.svg</b><br>Install app (⬇).</figcaption></figure><figure><div class="sw"><img src="ui/dice.svg"></div><figcaption><b>ui/dice.svg</b><br>Random seed (🎲).</figcaption></figure><figure><div class="sw"><img src="ui/trash.svg"></div><figcaption><b>ui/trash.svg</b><br>Delete world (🗑).</figcaption></figure><figure><div class="sw"><img src="ui/flame.svg"></div><figcaption><b>ui/flame.svg</b><br>Daily streak (🔥).</figcaption></figure><figure><div class="sw"><img src="ui/music.svg"></div><figcaption><b>ui/music.svg</b><br>Music (♪).</figcaption></figure><figure><div class="sw"><img src="ui/check.svg"></div><figcaption><b>ui/check.svg</b><br>Done / cleared (✓).</figcaption></figure><figure><div class="sw"><img src="ui/cross.svg"></div><figcaption><b>ui/cross.svg</b><br>Lost / close (✕).</figcaption></figure><figure><div class="sw"><img src="ui/arrow-right.svg"></div><figcaption><b>ui/arrow-right.svg</b><br>Direction arrows (→); the game rotates this one for ← ↑ ↓.</figcaption></figure><figure><div class="sw"><img src="ui/arrow-back.svg"></div><figcaption><b>ui/arrow-back.svg</b><br>Back buttons (←).</figcaption></figure><figure><div class="sw"><img src="ui/play-next.svg"></div><figcaption><b>ui/play-next.svg</b><br>Next level / Continue (▶).</figcaption></figure><figure><div class="sw"><img src="app/icon.svg"></div><figcaption><b>app/icon.svg</b><br>Main app image: home-screen / install icon (rounded square; corners stay transparent).</figcaption></figure><figure><div class="sw"><img src="app/icon-maskable.svg"></div><figcaption><b>app/icon-maskable.svg</b><br>Same picture, full bleed, no rounded corners. Keep everything important inside the central 80% circle: phones crop it.</figcaption></figure><figure><div class="sw"><img src="app/favicon.svg"></div><figcaption><b>app/favicon.svg</b><br>Browser tab icon. Shown at 16-32 px, so keep the picture bold and simple.</figcaption></figure><figure><div class="sw"><img src="app/logo.svg"></div><figcaption><b>app/logo.svg</b><br>The emblem on the main menu (a compass rose that is also a mine). The game name is written next to it as text.</figcaption></figure><figure><div class="sw"><img src="ui/worlds.svg"></div><figcaption><b>ui/worlds.svg</b><br>My worlds button (🗂).</figcaption></figure><figure><div class="sw"><img src="ui/volume.svg"></div><figcaption><b>ui/volume.svg</b><br>Audio is on (🔊), floating button on the main menu.</figcaption></figure><figure><div class="sw"><img src="ui/volume-off.svg"></div><figcaption><b>ui/volume-off.svg</b><br>Audio is off (🔇).</figcaption></figure><figure><div class="sw"><img src="ui/vibrate.svg"></div><figcaption><b>ui/vibrate.svg</b><br>Vibration is on (📳).</figcaption></figure><figure><div class="sw"><img src="ui/vibrate-off.svg"></div><figcaption><b>ui/vibrate-off.svg</b><br>Vibration is off (📴).</figcaption></figure><figure><div class="sw"><img src="ui/github.svg"></div><figcaption><b>ui/github.svg</b><br>Link to the author page (🐙), floating on the main menu.</figcaption></figure></main>
